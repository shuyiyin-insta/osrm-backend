<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>OSRM isochrone viewer</title>
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }

      #map {
        position: absolute;
        inset: 0;
      }

      #controls {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        max-width: 290px;
        padding: 12px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        font-size: 13px;
      }

      #controls label,
      #controls input,
      #controls select {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin: 5px 0 9px;
      }

      #controls input[type='checkbox'] {
        display: inline-block;
        width: auto;
        margin: 0 5px 0 0;
        vertical-align: middle;
      }

      #range-value {
        font-weight: bold;
      }

      #status {
        margin: 3px 0 0;
        line-height: 1.35;
      }

      .hint {
        margin: 0 0 10px;
        color: #4b5563;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="controls">
      <label for="server-url">OSRM server</label>
      <input
        id="server-url"
        type="url"
        value="http://localhost:5000"
        autocomplete="off"
      />

      <label for="range-slider"
        >Contour duration: <span id="range-value">900</span> seconds</label
      >
      <input
        id="range-slider"
        type="range"
        min="60"
        max="1800"
        step="30"
        value="900"
      />

      <label for="direction">Direction</label>
      <select id="direction">
        <option value="outbound" selected>
          Outbound: reachable from point
        </option>
        <option value="inbound">Inbound: can reach point</option>
      </select>

      <label for="polygons">
        <input id="polygons" type="checkbox" checked />
        Return polygons
      </label>

      <p class="hint">
        Click the map to request an isochrone. The initial point is San
        Francisco.
      </p>
      <div id="status" aria-live="polite">Waiting for the map.</div>
    </div>

    <script>
      'use strict';

      var DEFAULT_CENTER = [-122.39632, 37.79112];
      var map;
      var marker;
      var currentController;
      var lastClickedLngLat;

      var serverUrlInput = document.getElementById('server-url');
      var slider = document.getElementById('range-slider');
      var rangeValue = document.getElementById('range-value');
      var directionSelect = document.getElementById('direction');
      var polygonsCheckbox = document.getElementById('polygons');
      var status = document.getElementById('status');

      function setStatus(message) {
        status.textContent = message;
      }

      function updateRangeLabel() {
        rangeValue.textContent = slider.value;
      }

      function isCoordinate(value) {
        return (
          Array.isArray(value) &&
          value.length >= 2 &&
          Number.isFinite(Number(value[0])) &&
          Number.isFinite(Number(value[1]))
        );
      }

      function extendBounds(bounds, coordinates) {
        if (!Array.isArray(coordinates)) {
          return false;
        }
        if (isCoordinate(coordinates)) {
          bounds.extend([Number(coordinates[0]), Number(coordinates[1])]);
          return true;
        }
        var hasCoordinates = false;
        coordinates.forEach(function (coordinate) {
          hasCoordinates = extendBounds(bounds, coordinate) || hasCoordinates;
        });
        return hasCoordinates;
      }

      function getFeatureBounds(features) {
        var bounds = new maplibregl.LngLatBounds();
        var hasCoordinates = false;

        features.forEach(function (feature) {
          if (!feature || !feature.geometry) {
            return;
          }
          hasCoordinates =
            extendBounds(bounds, feature.geometry.coordinates) ||
            hasCoordinates;
        });

        return hasCoordinates && !bounds.isEmpty() ? bounds : null;
      }

      function describeFeatures(features) {
        var counts = {};
        features.forEach(function (feature) {
          var geometry = feature && feature.geometry;
          var type = geometry && geometry.type ? geometry.type : 'invalid';
          counts[type] = (counts[type] || 0) + 1;
        });

        return Object.keys(counts)
          .sort()
          .map(function (type) {
            return counts[type] + ' ' + type;
          })
          .join(', ');
      }

      function ensureLayers() {
        if (!map.getLayer('isochrone-fill')) {
          map.addLayer({
            id: 'isochrone-fill',
            type: 'fill',
            source: 'isochrone',
            filter: ['==', '$type', 'Polygon'],
            paint: {
              'fill-color': '#2563eb',
              'fill-opacity': 0.23,
            },
          });
        }
        if (!map.getLayer('isochrone-polygon-outline')) {
          map.addLayer({
            id: 'isochrone-polygon-outline',
            type: 'line',
            source: 'isochrone',
            filter: ['==', '$type', 'Polygon'],
            paint: {
              'line-color': '#1d4ed8',
              'line-width': 2,
              'line-opacity': 0.9,
            },
          });
        }
        if (!map.getLayer('isochrone-lines')) {
          map.addLayer({
            id: 'isochrone-lines',
            type: 'line',
            source: 'isochrone',
            filter: ['==', '$type', 'LineString'],
            paint: {
              'line-color': '#1d4ed8',
              'line-width': 2,
              'line-opacity': 0.9,
            },
          });
        }
      }

      function renderIsochrone(data) {
        if (
          !data ||
          data.type !== 'FeatureCollection' ||
          !Array.isArray(data.features)
        ) {
          throw new Error('OSRM did not return a GeoJSON FeatureCollection');
        }

        if (!map.getSource('isochrone')) {
          map.addSource('isochrone', {
            type: 'geojson',
            data: data,
          });
          ensureLayers();
        } else {
          map.getSource('isochrone').setData(data);
        }

        var bounds = getFeatureBounds(data.features);
        if (bounds) {
          map.fitBounds(bounds, { padding: 48, duration: 250, maxZoom: 15 });
        }

        setStatus(
          'Received ' +
            data.features.length +
            ' contour feature(s): ' +
            describeFeatures(data.features) +
            '.',
        );
      }

      function isochroneUrl(lngLat) {
        var serverUrl = serverUrlInput.value.replace(/\/+$/, '');
        if (!serverUrl) {
          throw new Error('Enter an OSRM server URL');
        }

        var parameters = new URLSearchParams({
          contours_seconds: slider.value,
          direction: directionSelect.value,
          polygons: polygonsCheckbox.checked ? 'true' : 'false',
        });

        return (
          serverUrl +
          '/isochrone/v1/driving/' +
          lngLat.lng.toFixed(7) +
          ',' +
          lngLat.lat.toFixed(7) +
          '?' +
          parameters.toString()
        );
      }

      function requestIsochrone(lngLat) {
        if (currentController) {
          currentController.abort();
        }
        currentController = new AbortController();
        updateRangeLabel();

        var url;
        try {
          url = isochroneUrl(lngLat);
        } catch (error) {
          setStatus(error.message);
          return;
        }

        setStatus(
          'Requesting ' +
            slider.value +
            ' second ' +
            directionSelect.value +
            ' contour…',
        );
        fetch(url, { signal: currentController.signal })
          .then(function (response) {
            return response.text().then(function (body) {
              var json;
              try {
                json = JSON.parse(body);
              } catch (error) {
                throw new Error(
                  'OSRM returned invalid JSON (HTTP ' + response.status + ')',
                );
              }
              if (!response.ok || (json.code && json.code !== 'Ok')) {
                throw new Error(
                  json.message || json.code || 'HTTP ' + response.status,
                );
              }
              return json;
            });
          })
          .then(renderIsochrone)
          .catch(function (error) {
            if (error.name !== 'AbortError') {
              console.error(error);
              setStatus('Isochrone request failed: ' + error.message);
            }
          });
      }

      function updateIsochrone() {
        if (lastClickedLngLat) {
          requestIsochrone(lastClickedLngLat);
        }
      }

      updateRangeLabel();

      map = new maplibregl.Map({
        container: 'map',
        style:
          'https://pnorman.github.io/tilekiln-shortbread-demo/colorful.json',
        center: DEFAULT_CENTER,
        zoom: 13,
      });

      map.on('load', function () {
        lastClickedLngLat = new maplibregl.LngLat(
          DEFAULT_CENTER[0],
          DEFAULT_CENTER[1],
        );
        marker = new maplibregl.Marker({ color: '#111827' })
          .setLngLat(lastClickedLngLat)
          .addTo(map);
        requestIsochrone(lastClickedLngLat);
      });

      map.on('click', function (event) {
        lastClickedLngLat = event.lngLat;
        marker.setLngLat(lastClickedLngLat);
        requestIsochrone(lastClickedLngLat);
      });

      slider.addEventListener('input', updateIsochrone);
      directionSelect.addEventListener('change', updateIsochrone);
      polygonsCheckbox.addEventListener('change', updateIsochrone);
      serverUrlInput.addEventListener('change', updateIsochrone);
    </script>
  </body>
</html>
